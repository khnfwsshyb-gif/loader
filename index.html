<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FBI Announcement</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background:
                url("https://i.pinimg.com/originals/51/ae/a3/51aea3393b8234a1e69d8713a0a58bc3.gif")
                no-repeat center center fixed;

            background-size: cover;

            font-family: "Courier New", Courier, monospace;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #ff0000;
            text-align: center;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 7px;

            transform: translateY(-10px);
        }

        .image-container {
            margin: 0;
            padding: 0;
        }

        .image-container img {
            width: 520px;
            max-width: 75vw;

            height: auto;

            display: block;

            margin: 0 auto;

            border: 2px solid #ff0000;
            border-radius: 10px;

            box-shadow:
                0 0 8px rgba(255,0,0,.5),
                0 0 18px rgba(255,0,0,.25);
        }

        .top-text {
            margin-top: 3px;

            font-size: 17px;
            font-weight: bold;

            color: #ff1c1c;

            text-shadow:
                0 0 5px #ff0000,
                0 0 10px #850000;

            letter-spacing: 1px;
        }

        .info {
            margin-top: 1px;

            font-size: 14px;
            line-height: 1.25;

            color: #ff0000;

            text-shadow:
                0 0 4px #ff0000,
                0 0 8px #7a0000;
        }

        .bottom-text {
            margin-top: 2px;

            font-size: 15px;
            font-weight: bold;

            color: #ff0000;

            text-shadow:
                0 0 4px #ff0000,
                0 0 8px #7a0000;
        }

        audio {
            display: none;
        }
    </style>
</head>

<body>

    <div class="main">

        <div class="image-container">
            <img src="Cat No GIF.gif" alt="FBI">
        </div>

        <div class="top-text">
            إعلان رسمي من فرقة FBI
        </div>

        <div class="info">
            FBI<br>
            RESPECT PEAKS<br>
            SPECIAL UNIT<br>
            SECURITY ANNOUNCEMENT
        </div>

        <div class="bottom-text">
            FBI SPECIAL UNIT
        </div>

        <audio autoplay loop>
            <source src="a.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script>
        document.addEventListener("click", function () {
            const audio = document.querySelector("audio");

            if (audio) {
                audio.play().catch(() => {});
            }
        });
    </script>

</body>
</html>
